send_monthly_report:
  name: Wyślij raport miesięczny
  description: Generuje rachunek HTML i wysyła go e-mailem do skonfigurowanych odbiorców.
  fields:
    recipients:
      name: Odbiorcy
      description: Opcjonalna lista adresów e-mail. Gdy pusta, używana jest domyślna konfiguracja.
      required: false
      example: "['biuro@example.com']"
      selector:
        text:
          multiple: true
    month:
      name: Miesiąc
      description: Miesiąc w formacie YYYY-MM. Domyślnie — poprzedni pełny miesiąc.
      required: false
      example: "2026-03"
      selector:
        text:

generate_preview:
  name: Podgląd raportu (HTML)
  description: Zwraca HTML wygenerowanego raportu bez wysyłki e-mailem. Użyteczne do testów.
  fields:
    month:
      name: Miesiąc
      description: Miesiąc w formacie YYYY-MM. Domyślnie — poprzedni pełny miesiąc.
      required: false
      example: "2026-03"
      selector:
        text:

send_test_email:
  name: Wyślij e-mail testowy
  description: Wysyła raport za bieżący miesiąc z prefiksem [TEST] w tytule — do weryfikacji konfiguracji SMTP i szablonu.
  fields:
    recipients:
      name: Odbiorcy
      description: Opcjonalna lista adresów — domyślnie używani są odbiorcy z konfiguracji.
      required: false
      example: "['ty@example.com']"
      selector:
        text:
          multiple: true
